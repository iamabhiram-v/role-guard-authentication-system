name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  # ── 1. Integration test ─────────────────────────────────────────────────────
  compose-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write backend CI env
        run: |
          cat > backend/.env << 'EOF'
          NODE_ENV=production
          PORT=3000
          DB_HOST=postgres
          DB_PORT=5432
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_NAME=postgres
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_TLS=false
          JWT_SECRET=ci-jwt-secret-not-real-32byteslong
          JWT_REFRESH_SECRET=ci-refresh-secret-not-real-32bytes
          JWT_EXPIRY=15m
          JWT_REFRESH_EXPIRY=7d
          CORS_ORIGIN=http://localhost
          FRONTEND_URL=http://localhost
          VAPID_SUBJECT=mailto:ci@example.com
          VAPID_PUBLIC_KEY=BEl62iUYgUivxIkv69yViEuiBIa-Ib9-SkvMeAtA3LFgDzkrxZJjSgSnfckjBJuBkr3qBUYIHBQFLXYp5Nksh8U
          VAPID_PRIVATE_KEY=UUxI4O8-FbRouAevSmBQ6co62groRwgtA-JDSt_HpSg
          SMTP_HOST=localhost
          SMTP_PORT=587
          SMTP_USER=ci@example.com
          SMTP_PASS=ci-not-real
          SMTP_FROM=ci@example.com
          TWILIO_ACCOUNT_SID=ACci000000000000000000000000000000
          TWILIO_AUTH_TOKEN=ci-not-real
          TWILIO_FROM_NUMBER=+10000000000
          R2_ACCOUNT_ID=ci
          R2_ACCESS_KEY_ID=ci
          R2_SECRET_ACCESS_KEY=ci
          R2_BUCKET_NAME=ci
          R2_PUBLIC_URL=http://localhost
          RAZORPAY_KEY_ID=rzp_test_ci
          RAZORPAY_KEY_SECRET=ci-not-real
          RAZORPAY_WEBHOOK_SECRET=ci-not-real
          GOOGLE_CLIENT_ID=ci
          GOOGLE_CLIENT_SECRET=ci
          GOOGLE_REDIRECT_URI=http://localhost/auth/google/callback
          RETENTION_DAYS=14
          EOF

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for backend
        run: |
          echo "Waiting for backend /health/ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health/ready; then
              echo "Backend ready"
              exit 0
            fi
            echo "Attempt $i/30 — sleeping 3s"
            sleep 3
          done
          echo "Backend never became ready"
          docker compose logs backend
          exit 1

      - name: Wait for frontend
        run: |
          echo "Waiting for frontend..."
          for i in $(seq 1 10); do
            if curl -sf http://localhost/health; then
              echo "Frontend ready"
              exit 0
            fi
            sleep 3
          done
          echo "Frontend never became ready"
          docker compose logs frontend
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ── 2. Build and push backend image ─────────────────────────────────────────
  backend:
    needs: compose-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ── 3. Build and push frontend image ────────────────────────────────────────
  frontend:
    needs: compose-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_RAZORPAY_KEY_ID=${{ secrets.VITE_RAZORPAY_KEY_ID }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ── 4. Deploy to Render ──────────────────────────────────────────────────────
  deploy-render:
    needs: [compose-integration, backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy
        run: |
          curl -fSs -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Deploy triggered"

      - name: Wait for Render to go live
        run: |
          echo "Polling production health..."
          for i in $(seq 1 60); do
            if curl -sf https://role-guard-authentication-system.onrender.com/health/live; then
              echo "Render is live"
              exit 0
            fi
            echo "Attempt $i/60 — sleeping 5s"
            sleep 5
          done
          echo "Render did not become healthy in time"
          exit 1